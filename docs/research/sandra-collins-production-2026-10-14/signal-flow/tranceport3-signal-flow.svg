<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2030" viewBox="0 0 1440 2030" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Tranceport.3 — recalled capture and final-print signal flow</title>
<desc id="diagram-desc">Review-only diagram based on the owner's recollection. Capture: vinyl, Technics 1200 with new Ortofon club DJ cartridge, mostly Rane MP22 phono stage, balanced analog into TC Finalizer 96K A/D with processing bypassed, Pro Tools with Mbox capture at 44.1 kilohertz and 24 bit, then manual track-by-track arrangement and editing. Final print: Pro Tools digital output into the same Finalizer 96K, recalled conversion to 96 kilohertz and 24 bit, external analog insert through D/A, Avalon 747 tube compressor and A/D, Finalizer 96K finishing at 44.1 kilohertz and 16 bit, AES digital into Alesis MasterLink at the same format. Exact insert routing is a functional reconstruction. Rates describe digital stages, not analog signals. The same Finalizer 96K is reused, not multiple units. Two label-delivery versions follow final capture: a continuous 44.1 kilohertz 16-bit mix file with cue-sheet index information, and a second copy already indexed by Scott and team. Mbox generation and connections remain unspecified. Physical medium, file format and second-copy type remain unconfirmed.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#ddb77c" stroke-width="1.5"/></marker></defs>
